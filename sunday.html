<title>Sunday | Sarah Brodrick</title>

<style>
:root {
  --bg: #FFFFFF; --panel: #F2F2F0; --ink: #111111; --muted: #76767A; --dot: #C4C4C6; --line: rgba(17,17,17,0.12);
  --cols: 12; --margin: clamp(16px, 3.333vw, 48px); --gap: clamp(12px, 1.667vw, 24px);
  --s-1: 8px; --s-2: 16px; --s-3: 24px; --s-4: 32px; --s-6: 48px; --s-8: 64px; --s-12: 96px; --s-16: 128px;
  --t-sm: 13px; --t-base: 16px; --t-md: clamp(17px, 1.389vw, 20px);
  --ease-out: cubic-bezier(0.19, 1, 0.22, 1); --ease-in-out: cubic-bezier(0.87, 0, 0.13, 1);
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--t-base); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
p { margin: 0; }
::selection { background: var(--ink); color: var(--bg); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.grid { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); column-gap: var(--gap); padding-left: var(--margin); padding-right: var(--margin); }

/* Page transitions */
.curtain { position: fixed; inset: 0; z-index: 100; background: var(--bg); pointer-events: none; }
.is-ready .curtain { opacity: 0; transition: opacity 0.45s var(--ease-out); }
.is-leaving .curtain { opacity: 1; transition: opacity 0.3s var(--ease-in-out); }
body > header, body > main, body > footer { transition: transform 0.3s var(--ease-in-out), filter 0.3s var(--ease-in-out); }
.is-leaving > header, .is-leaving > main, .is-leaving > footer { transform: translateY(-6px); }

/* Reveals */
.mask { display: block; overflow: hidden; }
.mask > span { display: block; transform: translateY(105%); transition: transform 0.9s var(--ease-out); transition-delay: calc(var(--d, 0) * 0.6s); }
.is-in .mask > span, .is-in.mask > span { transform: none; }
.fade { opacity: 0; transform: translateY(14px); transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out); transition-delay: calc(var(--d, 0) * 0.6s); }
.is-in .fade, .fade.is-in { opacity: 1; transform: none; }

/* Nav */
.nav { position: relative; z-index: 10; align-items: baseline; padding-top: var(--s-4); padding-bottom: var(--s-8); }
.brand { grid-column: 1 / 7; font-weight: 700; text-transform: uppercase; line-height: 24px; }
.nav__links { grid-column: 7 / -1; justify-self: end; }
.links { display: flex; align-items: center; margin: 0; padding: 0; list-style: none; line-height: 24px; color: var(--muted); }
.links li { display: flex; align-items: center; }
.links li + li::before { content: ""; width: 3px; height: 3px; margin: 0 12px; border-radius: 50%; background: var(--dot); }
.link { position: relative; display: inline-block; transition: color 0.3s var(--ease-out); }
.link::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform 0.35s var(--ease-out); }
a:hover .link, .link:hover { color: var(--ink); }
a:hover .link::after, .link:hover::after { transform: scaleX(1); transform-origin: left; }
.roll__word { display: inline-block; white-space: nowrap; }
.roll__ch { position: relative; display: inline-block; overflow: hidden; vertical-align: top; }
.roll__ch > span { display: block; transition: transform 0.55s var(--ease-out); transition-delay: calc(var(--i) * 18ms); }
.roll__ch > span + span { position: absolute; left: 0; top: 100%; }
a:hover .roll__ch > span, a:focus-visible .roll__ch > span { transform: translateY(-100%); }

/* Intro: what was made */
.intro { padding-top: var(--s-8); padding-bottom: var(--s-8); row-gap: var(--s-3); }
.back { grid-column: 1 / -1; display: inline-flex; align-items: center; gap: var(--s-1); justify-self: start; color: var(--muted); }
.back svg { transition: transform 0.35s var(--ease-out); }
.back:hover svg { transform: translateX(-4px); }
.eyebrow { grid-column: 1 / -1; margin-top: 0; font-size: var(--t-sm); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.title { grid-column: 1 / 11; margin: 0; font-size: clamp(36px, 5vw, 76px); font-weight: 500; line-height: 1.04; letter-spacing: -0.03em; text-wrap: balance; }
.summary { grid-column: 1 / 8; font-size: var(--t-md); color: var(--muted); text-wrap: pretty; }
.meta { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); margin: var(--s-6) 0 0; padding-top: var(--s-3); border-top: 1px solid var(--line); }
.meta dt { font-size: var(--t-sm); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.meta dd { margin: 4px 0 0; }

/* Hero visual: a panel that opens up as it enters */
.hero { margin: 0 var(--margin); }
/* Fits the window on desktop so the whole visual is seen; tinted per project */
.hero__panel { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 9; max-height: calc(100svh - 120px); width: 100%; overflow: hidden; background: var(--tint, var(--panel)); clip-path: inset(12% 6% 12% 6%); transition: clip-path 1.2s var(--ease-out); }
.hero.is-in .hero__panel { clip-path: inset(0 0 0 0); }
.hero__panel img { width: auto; max-width: 78%; height: 84%; object-fit: contain; transform: scale(1.12); transition: transform 1.6s var(--ease-out); }
.hero__art { display: grid; place-items: center; width: 100%; height: 100%; }
.hero__art svg { width: auto; height: 72%; max-width: 70%; transform: scale(1.08); transition: transform 1.6s var(--ease-out); }
.hero.is-in .hero__art svg { transform: none; }
.hero.is-in .hero__panel img { transform: none; }
.hero__word { font-size: clamp(64px, 14vw, 220px); font-weight: 500; letter-spacing: -0.045em; line-height: 1; color: var(--ink); transform: translateY(30%); opacity: 0; transition: transform 1.4s var(--ease-out), opacity 1s var(--ease-out); transition-delay: 0.15s; }
.hero.is-in .hero__word { transform: none; opacity: 1; }

/* Story rows: label in columns 1 to 4, content from column 5 */
.row { align-items: start; row-gap: var(--s-2); padding-top: var(--s-4); padding-bottom: var(--s-8); }
.row:first-of-type { margin-top: var(--s-12); }
.row::before { content: ""; grid-column: 1 / -1; height: 1px; margin-bottom: var(--s-3); background: var(--line); transform: scaleX(0); transform-origin: left; transition: transform 1.1s var(--ease-out); }
.row.is-in::before { transform: none; }
.label { grid-column: 1 / 5; margin: 0; font-size: var(--t-sm); font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
.body { grid-column: 5 / 12; font-size: var(--t-md); line-height: 1.55; text-wrap: pretty; }
.body p + p, .body p + .list, .body .list + p { margin-top: 1em; }
.list { margin: 0; padding: 0; list-style: none; }
.list li { position: relative; padding: 0.7em 0 0.7em 1.6em; border-bottom: 1px solid var(--line); }
.list li:first-child { border-top: 1px solid var(--line); }
.list li::before { content: ""; position: absolute; left: 0; top: 1.35em; width: 8px; height: 1px; background: var(--ink); }
.soon { color: var(--muted); }

/* Impact numbers */
.stats { grid-column: 5 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--gap); }
.stat__num { font-size: clamp(56px, 7vw, 112px); font-weight: 400; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.stat__label { margin-top: var(--s-1); color: var(--muted); max-width: 16em; }

/* ---------- Story visuals ---------- */
/* Figures sit under a row's text, from column 5 to the edge, and reveal with their row */
.figure { grid-column: 5 / -1; margin: var(--s-4) 0 0; }
.figure figcaption { margin-top: var(--s-2); font-size: var(--t-sm); color: var(--muted); max-width: 40em; }
.figure--trio .figure__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
.figure--pair .figure__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }

/* Image placeholder: marks where a screenshot belongs and what it should show */
.ph { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 9; padding: var(--s-3); border: 1px dashed rgba(15, 17, 20, 0.2); background: var(--panel) repeating-linear-gradient(135deg, transparent 0 14px, rgba(15, 17, 20, 0.025) 14px 15px); text-align: center; }
.figure--trio .ph { aspect-ratio: 4 / 5; }
.ph__inner { display: grid; justify-items: center; gap: var(--s-1); max-width: 30em; }
.ph__tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.ph__what { font-size: var(--t-md); line-height: 1.35; color: var(--ink); text-wrap: balance; }
.figure--trio .ph__what { font-size: var(--t-base); }
.ph__label { position: absolute; top: var(--s-2); left: var(--s-2); font-size: var(--t-sm); color: var(--ink); }

/* Personas */
.personas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.persona { display: grid; align-content: start; gap: var(--s-1); padding: var(--s-4) var(--s-3); background: var(--panel); }
.persona__role { font-size: var(--t-sm); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.persona__name { margin: var(--s-2) 0 0; font-size: clamp(24px, 2.2vw, 32px); font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
.persona__need { color: var(--muted); }

/* Wizard steps */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); margin: 0; padding: var(--s-4) var(--s-3); list-style: none; background: var(--panel); counter-reset: step; }
.step { position: relative; display: grid; gap: var(--s-1); padding-top: var(--s-6); counter-increment: step; }
.step::before { content: counter(step); position: absolute; top: 0; left: 0; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: #FFFFFF; font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
.step::after { content: ""; position: absolute; top: 16px; left: 44px; right: calc(-1 * var(--gap) + 8px); height: 1px; background: rgba(15, 17, 20, 0.2); }
.step:last-child::after { display: none; }
.step__name { font-weight: 500; }
.step__note { font-size: var(--t-sm); color: var(--muted); }

@media (max-width: 760px) {
  .figure { grid-column: 1 / -1; }
  .figure--trio .figure__grid, .figure--pair .figure__grid, .personas { grid-template-columns: minmax(0, 1fr); }
  .figure--trio .ph { aspect-ratio: 16 / 10; }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .step { padding-top: 0; padding-left: 48px; min-height: 32px; }
  .step::after { display: none; }
}

/* Next project */
.next { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: var(--s-1) var(--s-3); margin: var(--s-12) 0 0; padding: var(--s-12) var(--margin) var(--s-8); background: var(--panel); overflow: hidden; }
.next__label { grid-column: 1 / -1; font-size: var(--t-sm); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.next__name { font-size: clamp(36px, 6vw, 96px); font-weight: 500; letter-spacing: -0.035em; line-height: 1; transition: transform 0.7s var(--ease-out); }
.next__name em { font-style: normal; color: var(--muted); font-size: 0.4em; letter-spacing: -0.01em; margin-left: 0.3em; }
.next svg { transition: transform 0.7s var(--ease-out); }
.next:hover .next__name { transform: translateX(12px); }
.next:hover svg { transform: translateX(10px); }

/* The footer shares the panel colour so the next-project block runs edge to edge to the bottom */
.foot { padding-top: var(--s-3); padding-bottom: var(--s-6); background: var(--panel); }
html:has(body.project) { background: var(--panel); }
.foot .links { grid-column: 1 / -1; justify-self: end; }

@media (max-width: 760px) {
  :root { --cols: 4; --gap: 12px; }
  .brand { grid-column: 1 / -1; }
  .nav__links { grid-column: 1 / -1; justify-self: start; margin-top: var(--s-2); }
  .title, .summary, .label, .body, .stats { grid-column: 1 / -1; }
  .meta { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: var(--s-3); }
  .hero__panel { aspect-ratio: 4 / 5; }
  .hero__panel { max-height: none; }
  .hero__panel img { max-width: 84%; }
  .hero__art svg { height: auto; width: 76%; max-width: none; }
  .row { padding-bottom: var(--s-6); }
  .next { padding: var(--s-8) var(--margin) var(--s-6); }
  .foot .links { justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; transition-delay: 0s !important; }
}

/* ---------- Page-to-page loading: a hairline that runs along the top ---------- */
.pagebar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 150; height: 2px;
  background: var(--ink); transform: scaleX(0); transform-origin: left; pointer-events: none;
}
.is-leaving .pagebar { transform: scaleX(0.7); transition: transform 0.9s cubic-bezier(0.19, 1, 0.22, 1); }
.pagebar.is-arriving { animation: pagebar-in 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
@keyframes pagebar-in {
  0% { transform: scaleX(0.7); opacity: 1; }
  60% { transform: scaleX(1); opacity: 1; }
  100% { transform: scaleX(1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .pagebar { display: none; } }

/* Light page base: tells the browser this is a light page and paints the area behind it */
html { background: var(--bg); color-scheme: light; overscroll-behavior-y: none; }

/* ---------- Breadcrumb navigation ---------- */
.nav { align-items: center; }
.crumb { grid-column: 1 / 9; display: inline-flex; align-items: center; gap: 10px; min-width: 0; line-height: 24px; }
.crumb__back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); transition: color 0.3s var(--ease-out); }
.crumb__back:hover { color: var(--ink); }
.crumb__back svg { transition: transform 0.35s var(--ease-out); }
.crumb__back:hover svg { transform: translateX(-3px); }
.crumb__sep { color: var(--dot); }
.crumb__here { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav__links { grid-column: 9 / -1; }

/* ---------- Section sidebar: a sticky list of the case study's sections ---------- */
:root { --accent: #111111; }
body.has-toc main { display: grid; grid-template-columns: minmax(200px, 20%) minmax(0, 1fr); align-items: start; }
body.has-toc main > * { grid-column: 2; min-width: 0; }
body.has-toc main > .toc { grid-column: 1; grid-row: 1 / span 60; position: sticky; top: var(--s-6); padding: 0 var(--s-3) 0 var(--margin); }
body.has-toc main > .next { grid-column: 1 / -1; }
body.has-toc main .grid { padding-left: 0; }
body.has-toc .hero { margin: 0 var(--margin) 0 0; }
.toc ol { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.toc a { position: relative; display: block; padding-left: 16px; color: var(--muted); line-height: 1.4; transition: color 0.3s var(--ease-out); }
.toc a::before { content: ""; position: absolute; left: 0; top: 0.5em; width: 6px; height: 6px; background: var(--accent); transform: scale(0); transition: transform 0.35s var(--ease-out); }
.toc a:hover { color: var(--ink); }
.toc a.is-active { color: var(--accent); font-weight: 500; }
.toc a.is-active::before { transform: none; }
/* With the sidebar naming each section, labels sit above their content, which uses the full width */
@media (min-width: 1025px) {
  body.has-toc .row > .label { grid-column: 1 / -1; }
  body.has-toc .row > .body { grid-column: 1 / 10; }
  body.has-toc .row > .stats, body.has-toc .row > .figure { grid-column: 1 / -1; }
}
@media (max-width: 1024px) {
  body.has-toc main { display: block; }
  body.has-toc main > .toc { display: none; }
  body.has-toc main .grid { padding-left: var(--margin); }
  body.has-toc .hero { margin: 0 var(--margin); }
}
@media (max-width: 760px) {
  .crumb { grid-column: 1 / -1; }
  .nav__links { grid-column: 1 / -1; justify-self: start; margin-top: var(--s-1); }
}

/* Email: a link-styled button that copies the address, with a small confirmation */
.email-copy { padding: 0; border: 0; background: none; font: inherit; color: inherit; line-height: inherit; cursor: pointer; }
.copy-toast { position: fixed; left: 50%; top: calc(20px + env(safe-area-inset-top, 0px)); z-index: 300; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 999px; background: var(--text); color: #FFFFFF; font-family: var(--font); font-size: 14px; line-height: 1.4; opacity: 0; transform: translate(-50%, -12px); pointer-events: none; transition: opacity 0.3s var(--ease-out), transform 0.3s var(--ease-out); }
.copy-toast.is-on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.copy-toast__addr { user-select: all; -webkit-user-select: all; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- Password lock ---------- */
.lock { padding-top: var(--s-4); padding-bottom: var(--s-12); row-gap: var(--s-3); align-content: start; }
.lock .back { grid-column: 1 / -1; }
.lock__panel { grid-column: 1 / 8; display: grid; gap: var(--s-3); margin-top: var(--s-4); }
.lock__eyebrow { display: inline-flex; align-items: center; gap: var(--s-1); font-size: var(--t-sm); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lock__title { margin: 0; font-size: clamp(36px, 5vw, 76px); font-weight: 500; line-height: 1.04; letter-spacing: -0.03em; text-wrap: balance; }
.lock__text { font-size: var(--t-md); color: var(--muted); max-width: 32em; }
.lock__text a { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--dot); }
.lock__form { display: flex; gap: var(--s-2); align-items: stretch; margin-top: var(--s-3); max-width: 520px; }
.lock__form input { flex: 1; min-width: 0; height: 52px; padding: 0 var(--s-2); border: 1px solid var(--line); border-radius: 100px; background: #FFFFFF; color: var(--ink); font: inherit; font-size: var(--t-md); }
.lock__form input:focus-visible { outline: 2px solid var(--ink); outline-offset: 0; }
.lock__form button { height: 52px; padding: 0 var(--s-4); border: 0; border-radius: 100px; background: var(--ink); color: #FFFFFF; font: inherit; font-weight: 500; cursor: pointer; transition: opacity 0.3s var(--ease-out); }
.lock__form button:hover { opacity: 0.85; }
.lock__form button[disabled] { opacity: 0.5; cursor: progress; }
.lock__error { color: var(--accent); font-size: var(--t-sm); }
.lock.is-wrong .lock__form { animation: lock-shake 0.4s var(--ease-out); }
@keyframes lock-shake { 0%, 100% { transform: none; } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 760px) { .lock__panel { grid-column: 1 / -1; } .lock__form { flex-direction: column; } .lock__form input { flex: none; } }
/* Locked: keep the middle compact so header, lock and next project fit one desktop view */
body:has(#lock) > header.nav { padding-bottom: var(--s-4); }
.lock { padding-top: 0; padding-bottom: var(--s-6); }
.lock__panel { margin-top: 0; gap: var(--s-2); }
.lock__title { font-size: clamp(32px, min(4.4vw, 7svh), 64px); }
.lock__form { margin-top: var(--s-2); }
main:has(#lock) > .next { margin-top: 0; padding-top: var(--s-6); padding-bottom: var(--s-6); }
@media (min-width: 761px) {
  body:has(#lock) { display: flex; flex-direction: column; min-height: 100svh; }
  body:has(#lock) > main { flex: 1; display: flex; flex-direction: column; }
  main:has(#lock) > .lock { flex: 1; align-content: center; }
}
</style>
<style id="palette">
/* ---------- Palette: Direction 02, Clean & Playful ----------
   Coral is for action and emphasis only (CTAs, active states, eyebrows); baby blue for labels, tags and
   highlights; near-black doubles as the CTA background with white text. Pills are 100px, cards 20px. */
:root {
  --bg: #F7F7F6;          /* page canvas */
  --surface: #FFFFFF;     /* cards and panels */
  --border: #DDE2E8;      /* dividers and card edges */
  --text: #2E3034;        /* headings and body copy */
  --muted: #606874;       /* secondary labels, captions, nav links */
  --accent: #0F1114;      /* black: CTAs, active states, eyebrow labels */
  --accent-tint: #ECEEF1; /* accent pill and tag backgrounds */
  --blue: #A7DAFD;        /* secondary accent: tags, highlights, featured frames */
  --blue-tint: #E8F5FF;   /* blue pill and tag backgrounds */
  --r-pill: 100px;
  --r-card: 0;           /* square corners on cards, frames and panels */
  /* Older names used across the pages, mapped onto the palette */
  --ink: var(--text); --ink-2: var(--text); --line: var(--border); --dot: var(--border); --panel: var(--surface);
}
html, body { background: var(--bg); color: var(--text); }

<script>
/* Email: copy the address on click; if the browser blocks copying, show it selected instead */
(() => {
  const toast = document.createElement('div');
  toast.className = 'copy-toast';
  toast.setAttribute('role', 'status');
  toast.setAttribute('aria-live', 'polite');
  document.body.appendChild(toast);
  let timer;
  const show = (build, ms) => {
    toast.textContent = '';
    build(toast);
    toast.classList.add('is-on');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('is-on'), ms);
  };
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.email-copy');
    if (!btn) return;
    e.preventDefault();
    const email = btn.dataset.email;
    const copied = () => show((el) => { el.textContent = 'Email copied: ' + email; }, 2400);
    const manual = () => show((el) => {
      el.append('Copy my email: ');
      const addr = document.createElement('span');
      addr.className = 'copy-toast__addr';
      addr.textContent = email;
      el.appendChild(addr);
      const range = document.createRange();
      range.selectNodeContents(addr);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }, 6000);
    try {
      navigator.clipboard.writeText(email).then(copied, manual);
    } catch (err) {
      manual();
    }
  });
})();
</script>
<script type="text/plain" id="page-script">
(() => {
  const body = document.body;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Arriving from another page: finish the loading line instead of replaying the full loader */
  let fromNav = false;
  try { fromNav = sessionStorage.getItem('sb-nav') === '1'; sessionStorage.removeItem('sb-nav'); } catch (e) {}
  if (fromNav) { const bar = document.querySelector('.pagebar'); if (bar) bar.classList.add('is-arriving'); }

  // Letter roll on link text
  document.querySelectorAll('.link, .brand span').forEach((el) => {
    const text = el.textContent.trim();
    if (!text || el.querySelector('.roll__ch')) return;
    const a = el.closest('a');
    if (a && !a.hasAttribute('aria-label')) a.setAttribute('aria-label', a.textContent.trim().replace(/\s+/g, ' '));
    let n = 0;
    const frag = document.createDocumentFragment();
    text.split(/\s+/).forEach((word, wi) => {
      if (wi) frag.appendChild(document.createTextNode(' '));
      const w = document.createElement('span');
      w.className = 'roll__word';
      w.setAttribute('aria-hidden', 'true');
      for (const ch of word) {
        const c = document.createElement('span');
        c.className = 'roll__ch';
        c.style.setProperty('--i', n++);
        c.innerHTML = '<span></span><span></span>';
        c.firstChild.textContent = ch;
        c.lastChild.textContent = ch;
        w.appendChild(c);
      }
      frag.appendChild(w);
    });
    el.textContent = '';
    el.appendChild(frag);
  });

  // Page in
  requestAnimationFrame(() => requestAnimationFrame(() => {
    body.classList.add('is-ready');
    setTimeout(() => {
      document.querySelectorAll('.mask, .fade').forEach((el) => {
        if (!el.closest('[data-reveal]')) el.classList.add('is-in');
      });
    }, reduceMotion ? 0 : 120);
  }));

  // Page out
  document.querySelectorAll('a[data-transition]').forEach((a) => {
    a.addEventListener('click', (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();
      body.classList.add('is-leaving');
      try { sessionStorage.setItem('sb-nav', '1'); } catch (err) {}
      setTimeout(() => { window.location.href = a.href; }, reduceMotion ? 0 : 270);
    });
  });
  window.addEventListener('pageshow', (e) => { if (e.persisted) body.classList.remove('is-leaving'); });

  // Count the impact numbers up when they arrive
  const countUp = (el) => {
    const end = parseFloat(el.dataset.count);
    const dp = (el.dataset.count.split('.')[1] || '').length;
    if (reduceMotion) { el.textContent = end.toFixed(dp); return; }
    const t0 = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - t0) / 1400);
      const e = 1 - Math.pow(1 - t, 4);
      el.textContent = (end * e).toFixed(dp);
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  const mainEl = document.querySelector('main');
  const parts = [...mainEl.querySelectorAll(':scope > .intro, :scope > section.row')];
  if (parts.length > 2 && !mainEl.querySelector('.toc')) {
    const items = parts.map((s, i) => {
      if (!s.id) s.id = 'section-' + i;
      const label = s.classList.contains('intro') ? 'Overview' : (s.querySelector('.label') || s).textContent.trim();
      return { s, label };
    });
    const toc = document.createElement('aside');
    toc.className = 'toc';
    toc.setAttribute('aria-label', 'Sections');
    const ol = document.createElement('ol');
    items.forEach(({ s, label }) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + s.id;
      a.textContent = label;
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const top = label === 'Overview' ? 0 : s.getBoundingClientRect().top + window.scrollY - 32;
        window.scrollTo({ top, behavior: reduceMotion ? 'auto' : 'smooth' });
      });
      li.appendChild(a);
      ol.appendChild(li);
    });
    toc.appendChild(ol);
    mainEl.prepend(toc);
    body.classList.add('has-toc');
    const links = [...ol.querySelectorAll('a')];
    let ticking = false;
    const spy = () => {
      ticking = false;

  const KEY = "sb-unlock";
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const main = document.querySelector('main');
  const lock = document.getElementById('lock');
  const form = document.getElementById('lockForm');
  const input = document.getElementById('lock-password');
  const button = document.getElementById('lockButton');
  const error = document.getElementById('lockError');
  // Show the page chrome while locked (the page's own reveal script runs after unlocking)
  requestAnimationFrame(() => {
    document.body.classList.add('is-ready');
    document.querySelectorAll('header .fade, footer .fade').forEach((el) => el.classList.add('is-in'));
  });

  const decrypt = async (password) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
    return new TextDecoder().decode(plain);
  };
  const open = (html) => {
    main.innerHTML = html;
    // Run the page's own script now that its content exists
    const src = document.getElementById('page-script');
    if (src) new Function(src.textContent)();
  };
  const tryOpen = async (password, quiet) => {
    try {
      const html = await decrypt(password);
      try { sessionStorage.setItem(KEY, password); } catch (e) {}
      open(html);
      return true;
    } catch (e) {
      if (!quiet) {
        error.hidden = false;
        lock.classList.remove('is-wrong'); void lock.offsetWidth; lock.classList.add('is-wrong');
        input.select();
      }
      return false;
    }
  };

  let saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) tryOpen(saved, true);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!input.value) { input.focus(); return; }
    button.disabled = true; button.textContent = 'Checking';
    const ok = await tryOpen(input.value, false);
    if (!ok) { button.disabled = false; button.textContent = 'Unlock'; }
  });
})();

<style>
/* Square corners on every image, screenshot and card across the site.
   Circles (avatars, orbs, round photos) and pill buttons keep their shape. */
:is(img, video, picture, figure, canvas, iframe, .card, [class*="card"], [class*="shot"], [class*="frame"], [class*="panel"], [class*="tile"], [class*="figure"], [class*="hero__"], [class*="window"], [class*="screen"], [class*="phone"], .sx-list, .sx-row, .sx-note, .sx-tile, .sx-clock, .g1-win, .g1-row, .g1-thumb, .su3-card, .sb-list, .sb-row, .sb-photo, .sb-glass, .sb-app, .sb-clock, .sb-clock__side, .sb-shot, .sp2-sq, .wr2-cap img, .sbd__img, .jvid__screen, .dk__page, .lightbox img):not(#_sq1):not(#_sq2) { border-radius: 0 !important; }
:is(.fp-prod img, .su3-orb, .sx-orb, .sp2-disc, .sp2-orbit__ring, .sp2-ring, .sp2-icons span, .sp2-tt, .fp-split i, .fp-island, img[class*="avatar"], [class*="avatar"] img, [class*="avatar"]):not(#_sq1):not(#_sq2):not(#_sq3) { border-radius: 50% !important; }
</style>
<script>
/* Square corners on any card, panel or image larger than a chip; pills and circles keep their shape */
(() => {
  const run = () => document.querySelectorAll('body *').forEach((el) => {
    if (el.closest('button, a.btn, .mode, .fp-phone')) return;
    const cs = getComputedStyle(el); const r = parseFloat(cs.borderTopLeftRadius) || 0; if (!r || cs.borderTopLeftRadius.includes('%')) return;
    const b = el.getBoundingClientRect(); if (b.width < 110 || b.height < 56) return;
    if (r >= Math.min(b.width, b.height) / 2 - 1) return;
    el.style.setProperty('border-radius', '0', 'important');
  });
  if (document.readyState !== 'loading') run(); else document.addEventListener('DOMContentLoaded', run);
  addEventListener('load', run); setTimeout(run, 1500);
})();
</script>
